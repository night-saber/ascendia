<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCENDIA — Realm of Echoes</title>
<style>
:root{--ink:#0b0d17;--pan:#141828;--pan2:#1b2036;--line:#2d3556;--tx:#e8eaf6;--mut:#8f97b8;--gold:#e9b44c;--echo:#56d6c9;--bad:#e5566d;--ser:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;display:block;cursor:crosshair}
#chat{position:fixed;left:10px;bottom:10px;width:min(400px,48vw);z-index:5;pointer-events:none}
#chatlog{max-height:176px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:12.5px;line-height:1.4;text-shadow:0 1px 2px #000;padding:6px 8px;background:linear-gradient(180deg,rgba(8,10,24,0),rgba(8,10,24,.7));border-radius:8px}
#chatlog div{margin:1px 0;animation:fadeln 22s forwards}
@keyframes fadeln{0%,60%{opacity:1}100%{opacity:.28}}
#chat.open #chatlog div{animation:none;opacity:1}
#chatin{pointer-events:auto;display:none;width:100%;margin-top:4px;background:rgba(12,14,28,.95);border:1px solid var(--gold);color:#fff;padding:6px 8px;border-radius:6px;font:13px system-ui;outline:none}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1060px,96vw);max-height:88vh;overflow:auto;z-index:10;background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.8);padding-bottom:12px;user-select:none}
#panel.hidden{display:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;position:sticky;top:0;background:var(--pan);z-index:3}
.ph h2{margin:0;font:600 20px var(--ser);letter-spacing:.02em;color:var(--gold)}
.ph .res{font-size:13px;color:#f2d98b;margin-left:auto}
.nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);position:sticky;top:50px;background:var(--pan);z-index:3;overflow-x:auto}
.tab{cursor:pointer;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:8px 14px;font:600 13px system-ui}
.tab:hover{color:var(--tx)}.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.x{cursor:pointer;background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 10px;font-size:14px}
.x:hover{border-color:var(--bad);color:var(--bad)}
.pb{padding:12px 18px}
h3{margin:14px 0 6px;font:600 15px var(--ser);color:#c9cff0}
.btn{cursor:pointer;background:rgba(86,214,201,.08);border:1px solid rgba(86,214,201,.45);color:#d8fbf6;border-radius:6px;padding:5px 11px;font-size:12.5px;margin:2px;font-family:inherit}
.btn:hover{background:rgba(86,214,201,.22)}
.btn.dis{opacity:.35;pointer-events:none}
.btn.red{border-color:rgba(229,86,109,.7);background:rgba(229,86,109,.1);color:#ffdfe5}
.btn.gold{border-color:rgba(233,180,76,.8);background:rgba(233,180,76,.12);color:#fff0c8}
.btn.on{background:rgba(86,214,201,.35)}
.cols2{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.35fr);gap:18px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
.item{border:1px solid;border-left-width:4px;border-radius:6px;padding:5px 8px;font-size:12px;cursor:pointer;background:rgba(0,0,0,.3);margin-bottom:4px}
.item:hover{background:rgba(255,255,255,.07)}.item.sel{box-shadow:0 0 0 2px #fff inset}
.item.empty{border-color:#2a3050;color:#5c6485;cursor:default}
.sm{font-size:11px;opacity:.78}.aff{font-size:12px;color:#a8e6ff}.leg{color:#ff9a3a;font-size:12px;margin-top:2px}
.rn{display:inline-block;min-width:21px;text-align:center;border-radius:50%;font-size:10px;font-weight:700;color:#000;margin:1px 2px 0 0;padding:2px 3px}
.rn.e{background:none;border:1px dashed #889;color:#889}
.bar{height:8px;background:#0e1122;border-radius:4px;overflow:hidden;margin:4px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--echo))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stat{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tree{position:relative;height:640px;min-width:1260px}
.tn{position:absolute;width:58px;height:58px;border-radius:16px;border:2px solid #353d63;background:var(--pan2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.12s}
.tn .tr{position:absolute;bottom:-8px;right:-4px;font-size:10px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:0 4px}
.tn.av{border-color:var(--echo);box-shadow:0 0 12px rgba(86,214,201,.45)}
.tn.on{border-color:var(--gold);background:#2b2414;box-shadow:0 0 12px rgba(233,180,76,.4)}
.tn.lock{opacity:.3;cursor:default}
.tn:hover::after{content:attr(data-tip);position:absolute;left:64px;top:0;width:200px;z-index:20;background:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:6px 8px;font-size:11.5px;line-height:1.35;pointer-events:none;white-space:normal;color:#dde}
.bl{position:absolute;top:0;font:600 16px var(--ser);color:var(--gold)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px}
#toast div{background:rgba(14,17,32,.95);border:1px solid var(--gold);padding:6px 14px;border-radius:6px;font-size:13px;animation:tin 3.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#banner{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:19;pointer-events:none;text-align:center;font:700 32px var(--ser);letter-spacing:.08em;text-shadow:0 0 18px currentColor,0 3px 8px #000;opacity:0;transition:opacity .5s}
#banner small{display:block;font:500 13px system-ui;letter-spacing:.04em;color:#dde;text-shadow:0 2px 4px #000}
#banner.show{opacity:1}
#dlg{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);width:min(640px,92vw);z-index:15;display:none;background:rgba(14,17,32,.96);border:1px solid var(--gold);border-radius:10px;padding:12px 16px 12px 70px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
#dlg::before{content:'\2726';position:absolute;left:14px;top:14px;width:42px;height:42px;border-radius:50%;background:#2b2414;border:2px solid var(--gold);color:var(--gold);font-size:22px;display:flex;align-items:center;justify-content:center}
#dlg .dw{font:700 15px var(--ser);color:var(--gold);margin-bottom:3px}
#dlgt{font-size:15px;line-height:1.45}
#dlg .btn{position:absolute;right:10px;top:8px;font-size:11px;padding:2px 8px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2d3556;border-radius:4px}
#login{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1a1d3c 0%,#0c0e1c 60%,#07080f 100%)}
.lbox{width:min(380px,92vw);background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:10px;padding:22px 22px 16px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.lbox h1{margin:0;text-align:center;letter-spacing:.22em;font:600 32px var(--ser);color:var(--gold)}
.lsub{text-align:center;font:italic 14px var(--ser);color:var(--mut);margin:2px 0 14px}
.lbox input{width:100%;margin:4px 0;background:var(--ink);border:1px solid var(--line);color:#fff;padding:9px 10px;border-radius:6px;font:14px system-ui;outline:none}
.lbox input:focus{border-color:var(--gold)}
.lrow{display:flex;gap:6px;margin:6px 0}.lrow .btn{flex:1;padding:8px}
#lg-msg{min-height:18px;margin:6px 0 2px;font-size:12.5px;color:#ff8a9a;text-align:center}
.lbox details{margin-top:10px;font-size:12px;color:var(--mut)}.lbox summary{cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="chat"><div id="chatlog"></div><input id="chatin" maxlength="90" autocomplete="off" placeholder="Chat here — /help lists commands"></div>
<div id="panel" class="hidden"></div>
<div id="toast"></div>
<div id="dlg"><div class="dw">Warden Eira</div><div id="dlgt"></div><button class="btn" id="dlgs">Skip tutorial</button></div>
<div id="banner"></div>
<div id="login"><div class="lbox"><h1>ASCENDIA</h1><div class="lsub">Realm of Echoes</div>
<input id="lg-u" placeholder="Username" maxlength="16" autocomplete="username" spellcheck="false">
<input id="lg-p" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div class="lrow"><button id="lg-in" class="btn gold">Log in</button><button id="lg-reg" class="btn">Create account</button></div>
<button id="lg-guest" class="btn" style="width:100%;padding:8px">Play as guest (saves on this device only)</button>
<div id="lg-msg"></div>
<details><summary>Multiplayer server (optional)</summary><input id="lg-srv" placeholder="ws://host:8080" spellcheck="false"><button id="lg-con" class="btn" style="width:100%">Connect</button></details>
<div class="sm" id="lg-net" style="margin-top:8px"></div></div></div>
<script>
'use strict';
(function(){
// ============================================================ UTILITIES
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
let _u=Math.floor(Math.random()*1e6);const uid=()=>'i'+(_u++).toString(36);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fmt(n){n=Math.floor(n);if(n<1000)return''+n;const u=['K','M','B','T','Qa','Qi','Sx'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toFixed(v<10?2:v<100?1:0)+u[i];}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function hexA(h,a){const c=hexRGB(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function shade(h,k){const c=hexRGB(h).map(v=>clamp(Math.round(k>=0?v+(255-v)*k:v*(1+k)),0,255));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');}
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};return'#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}

// ============================================================ CANVAS / INPUT
const cv=$('c'),ctx=cv.getContext('2d');
const lightC=document.createElement('canvas'),lctx=lightC.getContext('2d');
let W=800,H=600;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;lightC.width=Math.ceil(W/2);lightC.height=Math.ceil(H/2);}
addEventListener('resize',resize);
const keys={},pressed={};
const mouse={x:0,y:0,wx:0,wy:0,l:false,r:false,rp:false,lp:false};
let typing=false,started=false;
const kname=e=>e.key===' '?'space':String(e.key).toLowerCase();
addEventListener('keydown',e=>{
  if(!started)return;
  if(typing){if(e.key==='Enter'){sendChat();e.preventDefault();}else if(e.key==='Escape'){closeChat();}return;}
  initAudio();
  const k=kname(e);
  if(k==='space'||k.indexOf('arrow')===0||k==='tab')e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;pressed[k]=true;onKey(k,e);
});
addEventListener('keyup',e=>{keys[kname(e)]=false;});
cv.addEventListener('mousedown',e=>{initAudio();if(e.button===0){mouse.l=true;mouse.lp=true;}if(e.button===2){mouse.r=true;mouse.rp=true;}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;});

// ============================================================ AUDIO (Web Audio synth)
let AC=null,master=null,noiseBuf=null,musTimer=null,musStep=0;const lastSfx={};
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.4;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    startMusic();
  }catch(e){AC=null;}
}
function tone(f,d,type,vol,slide,delay){
  if(!AC||(S&&S.set.mute))return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide&&slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,vol,fq){
  if(!AC||(S&&S.set.mute))return;
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=fq||1500;g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);
}
const SFX={
  shoot:()=>tone(560+Math.random()*120,.06,'square',.035,.5),
  hit:()=>tone(190,.05,'sawtooth',.05,.5),
  kill:()=>{tone(320,.12,'triangle',.1,.4);noise(.1,.08,1400);},
  hurt:()=>{tone(130,.22,'sawtooth',.16,.5);noise(.16,.12,700);},
  dodge:()=>noise(.18,.1,2600),
  nova:()=>{tone(180,.45,'sawtooth',.12,3);noise(.3,.1,2200);},
  ward:()=>{tone(440,.4,'sine',.15,2);tone(660,.4,'sine',.1,2,.05);},
  ult:()=>{tone(110,.8,'sawtooth',.16,4);tone(220,.8,'square',.08,4);},
  loot:()=>{tone(880,.08,'sine',.12);tone(1320,.12,'sine',.12,1,.07);},
  coin:()=>tone(1500+Math.random()*300,.05,'square',.03),
  legend:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.16,1,i*.09)),
  level:()=>[392,523,659,784].forEach((f,i)=>tone(f,.22,'square',.09,1,i*.08)),
  jump:()=>tone(280,.15,'square',.07,2.4),
  land:()=>noise(.06,.06,500),
  click:()=>tone(900,.03,'square',.04),
  boss:()=>{tone(70,1.2,'sawtooth',.2,.5);tone(73,1.2,'square',.1,.5);noise(.8,.15,300);},
  react:()=>{tone(700,.15,'triangle',.1,1.6);noise(.1,.08,3000);},
  die:()=>{tone(220,.8,'sawtooth',.2,.2);noise(.6,.15,500);},
  portal:()=>{tone(200,.8,'sine',.14,3);tone(300,.8,'triangle',.08,3,.1);},
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'square',.09,1,i*.09)),
  buy:()=>{tone(660,.06,'square',.07);tone(990,.1,'square',.07,1,.06);}
};
function sfx(n){
  if(!AC||!S||S.set.mute)return;
  const now=performance.now();if(lastSfx[n]&&now-lastSfx[n]<(n==='shoot'||n==='hit'||n==='coin'?45:20))return;lastSfx[n]=now;
  const f=SFX[n];if(f)f();
}
function startMusic(){
  if(musTimer)return;
  musTimer=setInterval(()=>{
    if(!AC||!S||S.set.mute||document.hidden)return;
    const m=mode==='plat'?'plat':mode==='dun'?(D&&D.boss?'boss':'dun'):'hub';
    const sc={hub:[0,3,7,10,12,10,7,3],dun:[0,0,3,0,5,0,3,7],boss:[0,3,0,6,0,3,7,6],plat:[0,4,7,12,7,4,9,5]}[m];
    const root={hub:196,dun:98,boss:82,plat:262}[m];
    const f=root*Math.pow(2,sc[musStep%sc.length]/12);
    tone(f,m==='hub'?.55:.22,m==='plat'?'square':'triangle',m==='boss'?.05:.035,1);
    if(musStep%8===0)tone(root/2,1.7,'sine',.04,1);
    if(m==='boss'&&musStep%2===0)noise(.05,.03,200);
    musStep++;
  },240);
}

// ============================================================ DATA TABLES
const ELS=['phys','fire','frost','volt','venom'];
const ECOL={phys:'#e6ecff',fire:'#ff7a2e',frost:'#6fd6ff',volt:'#ffe94a',venom:'#7dff5a'};
const RAR=[{n:'Common',c:'#b8b8c4'},{n:'Magic',c:'#5d9dff'},{n:'Rare',c:'#ffd24a'},{n:'Epic',c:'#c45dff'},{n:'Legendary',c:'#ff7a2e'}];
const SLOTS=['weapon','armor','trinket','ring'];
const SL={weapon:'w',armor:'a',trinket:'t',ring:'r'};
const INV_MAX=60;
const BASES={
  weapon:[{n:'Wand',rate:5,spd:560,dmg:1,pat:'single'},{n:'Longbow',rate:2.6,spd:780,dmg:2.1,pat:'pierce'},{n:'Staff',rate:1.5,spd:380,dmg:3.4,pat:'orb'},{n:'Chakram',rate:2.4,spd:520,dmg:1.9,pat:'bounce'},{n:'Scepter',rate:3.4,spd:600,dmg:1.5,pat:'spread'}],
  armor:[{n:'Robe',hp:1,dr:2},{n:'Leather Vest',hp:1.4,dr:4},{n:'Plate Mail',hp:1.9,dr:7}],
  trinket:[{n:'Charm'},{n:'Idol'},{n:'Amulet'}],
  ring:[{n:'Band'},{n:'Signet'},{n:'Loop'}]
};
const PRE=[
  {k:'dmgP',n:'Savage',l:'+{v}% Damage',lo:5,hi:12,s:'wrt'},
  {k:'aspd',n:'Swift',l:'+{v}% Attack Speed',lo:4,hi:10,s:'wr'},
  {k:'hp',n:'Vital',l:'+{v} Max Life',lo:18,hi:42,s:'art'},
  {k:'move',n:'Fleet',l:'+{v}% Move Speed',lo:3,hi:8,s:'art'},
  {k:'crit',n:'Keen',l:'+{v}% Crit Chance',lo:2,hi:5,s:'wrt'},
  {k:'critD',n:'Ruthless',l:'+{v}% Crit Damage',lo:10,hi:30,s:'wr'},
  {k:'fire',n:'Blazing',l:'+{v}% Fire Damage',lo:8,hi:20,s:'wrt'},
  {k:'frost',n:'Glacial',l:'+{v}% Frost Damage',lo:8,hi:20,s:'wrt'},
  {k:'volt',n:'Storming',l:'+{v}% Volt Damage',lo:8,hi:20,s:'wrt'},
  {k:'venom',n:'Toxic',l:'+{v}% Venom Damage',lo:8,hi:20,s:'wrt'},
  {k:'dmg',n:'Sharpened',l:'+{v} Damage',lo:3,hi:8,s:'wr'},
  {k:'hpP',n:'Stalwart',l:'+{v}% Max Life',lo:3,hi:8,s:'a'}
];
const SUF=[
  {k:'ls',n:'of the Leech',l:'+{v}% Life Steal',lo:1,hi:2},
  {k:'gf',n:'of Fortune',l:'+{v}% Gold Find',lo:8,hi:25},
  {k:'xpf',n:'of Wisdom',l:'+{v}% XP Gain',lo:6,hi:18},
  {k:'dr',n:'of Warding',l:'+{v}% Damage Reduction',lo:2,hi:5},
  {k:'cdr',n:'of Haste',l:'+{v}% Cooldown Reduction',lo:4,hi:10},
  {k:'multi',n:'of Echoes',l:'+{v}% Multishot Chance',lo:4,hi:12},
  {k:'regen',n:'of Renewal',l:'+{v} Life per second',lo:1,hi:3},
  {k:'ldrop',n:'of Plunder',l:'+{v}% Loot Chance',lo:5,hi:15}
];
const LEG=[
  {id:'explode',n:'Cataclysm',d:'Slain enemies explode for heavy damage'},
  {id:'ricochet',n:'Ricochet',d:'Your shots bounce once more'},
  {id:'chain',n:'Stormcaller',d:'Volt hits arc to 2 extra enemies'},

function rollRar(boost,f){
  boost=boost||0;const fl=f==null?((mode==='dun'&&D)?D.f:S.p.maxFloor):f;
  const w=[72,22,5,.9,fl>=20?.12:0].map((v,i)=>v*(1+boost*i*.35));
  let t=0;for(const v of w)t+=v;let r=Math.random()*t;
  for(let i=0;i<5;i++){r-=w[i];if(r<=0)return i;}return 0;
}
function genItem(ilvl,rar,slot){
  ilvl=Math.max(1,Math.floor(ilvl));
  if(rar==null)rar=rollRar((ST&&ST.ldrop)?ST.ldrop/100:0);
  slot=slot||pick(['weapon','weapon','armor','armor','trinket','ring','ring']);
  const _fl=(mode==='dun'&&D)?D.f:(S?S.p.maxFloor:0);if(rar>=4&&_fl<20)rar=3;
  const base=pick(BASES[slot]);
  const it={id:uid(),slot:slot,base:base.n,rar:rar,ilvl:ilvl,el:null,ln:[],sock:[],leg:null,bd:0,bh:0,bdr:0,wb:null,name:''};
  if(slot==='weapon'){it.bd=Math.round((3+ilvl*1.7)*base.dmg*(1+rar*.12));it.wb={rate:base.rate,spd:base.spd,pat:base.pat};if(rar>=1&&chance(.65))it.el=pick(['fire','frost','volt','venom']);}
  if(slot==='armor'){it.bh=Math.round((12+ilvl*5)*base.hp*(1+rar*.1));it.bdr=base.dr;}
  const nA=[0,ri(1,2),ri(3,4),ri(4,5),5][rar];
  const pool=PRE.filter(a=>a.s.indexOf(SL[slot])>=0),used={},pre=[],suf=[];
  for(let i=0;i<nA;i++){
    const usePre=i%2===0,src=usePre?pool:SUF;let a,tries=0;
    do{a=pick(src);tries++;}while(used[a.k]&&tries<25);
    if(used[a.k])continue;used[a.k]=1;
    const v=Math.max(1,Math.round(rnd(a.lo,a.hi)*(1+ilvl*.035)*(1+rar*.08)));
    it.ln.push({k:a.k,v:v,l:a.l.replace('{v}',v)});(usePre?pre:suf).push(a.n);
  }
  let nm=base.n;
  if(rar>=1)nm=(pre[0]?pre[0]+' ':'')+base.n+(suf[0]?' '+suf[0]:'');
  if(rar>=2){const a=pick(NAMEA);nm=a+pick(NAMEB)+' '+base.n;}
  if(rar===4)it.leg=pick(LEG);
  if(rar>=2){const n=Math.min(3,ri(0,rar-1)+(rar>=3?1:0));it.sock=new Array(n).fill(null);}
  it.name=nm;return it;
}
function itemStats(it){
  const s={},add=(k,v)=>{s[k]=(s[k]||0)+v;};
  if(it.bd)add('dmg',it.bd);if(it.bh)add('hp',it.bh);if(it.bdr)add('dr',it.bdr);
  for(const a of it.ln)add(a.k,a.v);
  for(const r of it.sock){if(r){const R=RUNES[r.t];add(R.k,Math.round(R.v*r.tier*(r.tier>=3?1.25:1)*10)/10);}}
  return s;
}
function itemVal(it){return Math.round([8,35,140,520,2200][it.rar]*(1+it.ilvl*.22)*(1+it.sock.length*.15));}
const sellVal=it=>Math.max(1,Math.round(itemVal(it)*.4));

function itemCard(it,o){
  o=o||{};const R=RAR[it.rar];

  if(it.slot==='armor')h+='<div class="sm" style="color:#cde">+'+it.bh+' life · '+it.bdr+'% DR</div>';

  ctx.fillStyle=o.tip||'#fff';ctx.beginPath();ctx.arc(24.5*s,2*s,3.4*s,0,TAU);ctx.fill();
  ctx.restore();
}
function bar(x,y,w,h,p,c1,c2,label){
  ctx.fillStyle='rgba(8,10,24,.75)';rr(x-2,y-2,w+4,h+4,5);ctx.fill();
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;
  if(p>0){rr(x,y,Math.max(2,w*clamp(p,0,1)),h,4);ctx.fill();}
  if(label){ctx.fillStyle='#fff';ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h-2);ctx.textAlign='left';}
}
function lighting(cx,cy,ambient,lights,tint){
  const lw=lightC.width,lh=lightC.height;
  lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,lw,lh);
  lctx.fillStyle=tint||'rgba(4,5,16,'+ambient+')';lctx.fillRect(0,0,lw,lh);
  lctx.globalCompositeOperation='destination-out';
  for(const L of lights){
    const x=(L.x-cx)/2,y=(L.y-cy)/2,r=L.r/2;if(x<-r||y<-r||x>lw+r||y>lh+r)continue;
    const g=lctx.createRadialGradient(x,y,r*.08,x,y,r);g.addColorStop(0,'rgba(0,0,0,'+(L.a==null?1:L.a)+')');g.addColorStop(.6,'rgba(0,0,0,'+(L.a==null?.5:L.a*.5)+')');g.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=g;lctx.beginPath();lctx.arc(x,y,r,0,TAU);lctx.fill();
  }
  ctx.drawImage(lightC,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const L of lights){
    if(!L.c)continue;const x=L.x-cx,y=L.y-cy,r=L.r*.8;if(x<-r||y<-r||x>W+r||y>H+r)continue;
    ctx.globalAlpha=(L.ga==null?.22:L.ga);const sp=glow(L.c,64);ctx.drawImage(sp,x-r,y-r,r*2,r*2);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

function recalc(){
  const P=S.p;
  const s={dmg:0,dmgP:0,aspd:0,hp:0,hpP:0,move:0,crit:3,critD:40,ls:0,gf:0,xpf:0,dr:0,cdr:0,multi:0,regen:0,ldrop:0,fire:0,frost:0,volt:0,venom:0,pierce:0,dodgeC:1,potion:2,rune:0,idle:0,offline:0,flags:{}};
  s.hp=55+P.lvl*8;s.dmg=3+P.lvl*1.5;
  s.weapon=null;
  for(const sl of SLOTS){
    const it=P.eq[sl];if(!it)continue;
    const st=itemStats(it);for(const k in st)s[k]=(s[k]||0)+st[k];
    if(it.leg)s.flags[it.leg.id]=1;if(sl==='weapon')s.weapon=it;
  }
  const fx=(o,r)=>{if(o.fx)for(const k in o.fx)s[k]=(s[k]||0)+o.fx[k]*r;if(o.flag)s.flags[o.flag]=1;};
  for(const id in P.tal)if(TAL[id])fx(TAL[id],P.tal[id]);
  for(const id in P.perks)if(APERK[id])fx(APERK[id],P.perks[id]);
  for(const id in P.art)if(ARTS[id])fx(ARTS[id],P.art[id]);
  for(const id in P.skills)if(PASS[id])s[PASS[id].k]+=PASS[id].v*(P.skills[id].l-1);
  if(GUILD){const gp=Math.min(10,GUILD.members.length);s.xpf+=gp;s.gf+=gp;}
  s.maxhp=Math.round(s.hp*(1+s.hpP/100));
  s.cdr=Math.min(s.cdr,60);s.dr=Math.min(s.dr,75);s.crit=Math.min(s.crit,80);s.ls=Math.min(s.ls,25);
  s.dodgeC=Math.floor(s.dodgeC);s.potion=Math.floor(s.potion);
  ST=s;
  if(pl.hp>ST.maxhp)pl.hp=ST.maxhp;
}

const QPLACE=['the Hollow Crypt','Emberdeep','Frostmere','the Whispering Ruins','Stormspire','the Gloaming','Ashen Vale','Starfall Keep'];
function genQuest(){
  const P=S.p,ref=Math.max(1,P.maxFloor);const type=pick(['kill','kill','killel','floor','loot','boss','gold']);
  const q={id:uid(),type:type,have:0,done:false,n:1,d:''};
  switch(type){
    case'kill':q.n=ri(30,60)+ref*5;q.d='Slay '+q.n+' monsters';break;
    case'killel':q.el=pick(['fire','frost','volt','venom']);q.n=ri(15,35)+ref*2;q.d='Slay '+q.n+' '+q.el+'-attuned monsters';break;
    case'floor':q.n=ref+ri(1,3);q.d='Reach dungeon floor '+q.n;break;
    case'trial':q.n=ri(1,2);q.d='Complete '+q.n+' secret-dimension trial'+(q.n>1?'s':'');break;
    case'loot':q.n=ri(2,5);q.d='Find '+q.n+' Rare+ items';break;
    case'boss':q.n=ri(1,2);q.d='Defeat '+q.n+' dungeon boss'+(q.n>1?'es':'');break;
    default:q.n=Math.round((200+ref*150)*ri(1,3));q.d='Collect '+q.n+' gold in dungeons';
  }
  q.name=pick(['Purge','Hunt','Delve','Culling','Pilgrimage','Reckoning','Vigil'])+' of '+pick(QPLACE);
  const m=1+ref*.35;q.rew={gold:Math.round(rnd(80,200)*m*1.8),ess:Math.round(rnd(5,20)*m),xp:Math.round(rnd(60,150)*m*2),rune:chance(.5),item:chance(.35)?ri(1,3):null};
  return q;
}
function ensureQuests(){while(S.quests.length<4)S.quests.push(genQuest());}

    if(q.type===type||(type==='kill'&&q.type==='killel'&&q.el===el)){
      if(q.type==='floor')q.have=Math.max(q.have,v);else q.have+=v;
      if(q.have>=q.n){q.have=q.n;q.done=true;chat('System','','Quest complete: '+q.name+' — claim at the Quest Board (J)');toast('Quest complete: '+q.name);sfx('loot');}
    }

}
function claimQuest(id){

function doAscend(){

  pool.sort((a,b)=>itemVal(b)-itemVal(a));const keep=pool.slice(0,keepN);

  const dummy=mk('grunt',c(0).x+130,c(0).y-90,40);dummy.tdummy=true;dummy.dmg=0;

function drawTutArrow(){
  if(!G.tut||!D||D.f!==0)return;const st=TUT[G.tut.i];if(!st||!st.tg)return;const t=st.tg();if(!t)return;
  const sx=t.x-cam.x,sy=t.y-cam.y-30,m=60,inx=sx>m&&sx<W-m&&sy>m&&sy<H-m;

  if(inx){ctx.translate(sx,sy-26+Math.sin(G.t*6)*7);ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(-14,-6);ctx.lineTo(-5,-6);ctx.lineTo(-5,-20);ctx.lineTo(5,-20);ctx.lineTo(5,-6);ctx.lineTo(14,-6);ctx.closePath();}
  else{const a=Math.atan2(sy-H/2,sx-W/2);ctx.translate(clamp(W/2+Math.cos(a)*W,m,W-m),clamp(H/2+Math.sin(a)*H,m,H-m));ctx.rotate(a);ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-13);ctx.lineTo(-4,0);ctx.lineTo(-10,13);ctx.closePath();}

    case'talent':{const n=TAL[d.id],rk=P.tal[d.id]||0,tp=talPoints();if(!n||rk>=n.max||tp.free<=0)return;if(n.req&&!n.req.every(r=>(P.tal[r]||0)>0))return;P.tal[d.id]=rk+1;recalc();sfx('click');break;}

const LAMPS=[[1000,540],[1200,540],[820,720],[1380,720],[1000,930],[1200,950],[700,470],[1500,470],[600,800],[1560,800],[420,520],[1100,420]];
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l=vx*vx+vy*vy;let t=l?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+vx*t),py-(ay+vy*t));}
const TREES=[];
(function(){
  const rg=mulberry(777);
  for(let i=0;i<600&&TREES.length<64;i++){
    const x=rg()*HW,y=rg()*HH;if(x<60||y<60||x>HW-60||y>HH-60)continue;
    if(Math.hypot(x-PLAZA.x,y-PLAZA.y)<PLAZA.r+60)continue;
    let bad=false;
    for(const s of STN){
      if(s.gate){if(Math.hypot(x-s.x,y-s.y)<150){bad=true;break;}}
      else if(x>s.x-70&&x<s.x+s.w+70&&y>s.y-70&&y<s.y+s.h+90){bad=true;break;}
      if(segDist(x,y,PLAZA.x,PLAZA.y,s.ix,s.iy)<75){bad=true;break;}
    }
    if(!bad)TREES.push({x:x,y:y,s:rg()*.5+.8,ph:rg()*6});
  }
})();
function hubBlocked(x,y,r){
  if(x<r+10||y<r+10||x>HW-r-10||y>HH-r-10)return true;
  for(const s of STN){if(s.gate)continue;if(x>s.x-r&&x<s.x+s.w+r&&y>s.y-r&&y<s.y+s.h+r)return true;}
  for(const t of TREES){if(Math.abs(t.x-x)<20+r&&Math.abs(t.y-y)<14+r*.6&&Math.hypot(t.x-x,t.y-y)<18+r)return true;}
  if(Math.hypot(x-PLAZA.x,y-PLAZA.y)<46+r)return true;
  return false;
}

function updHub(dt){
  const P=S.p;

  const l=Math.hypot(ix,iy);if(l){ix/=l;iy/=l;}
  const sp=185*(1+ST.move/100)*(keys.shift?1.5:1);
  if(!hubBlocked(pl.x+ix*sp*dt,pl.y,9))pl.x+=ix*sp*dt;

function drawTree(t){

function interactTarget(){

  for(const c of D.chests)if(!c.open)t(c,'chest','Open chest');
  for(const s of D.shrines)if(!s.used)t(s,'shrine',SHRINES[s.k]);
  if(D.exit&&D.exit.active)t(D.exit,'exit',D.boss?'Descend (boss defeated)':'Descend to next floor');

function interact(){

function updPB(dt){
  const arr=D.pb;
  for(let i=arr.length-1;i>=0;i--){
    const b=arr[i];b.life-=dt;
    const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;
    if(solidD(nx,ny)){
      if(b.bounce>0){b.bounce--;const sx=solidD(nx,b.y),sy=solidD(b.x,ny);if(sx)b.vx=-b.vx;if(sy)b.vy=-b.vy;if(!sx&&!sy){b.vx=-b.vx;b.vy=-b.vy;}b.hit.length=0;}
      else{b.life=0;burst(b.x,b.y,b.col,3,80,.25,2);}
    }else{b.x=nx;b.y=ny;}
    if(b.life>0){
      for(const e of D.enemies){
        if(e.dead||b.hit.indexOf(e.id)>=0)continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
          b.hit.push(e.id);bulletHit(b,e);
          if(b.aoe){aoe(b.x,b.y,b.aoe,b.dmg*.6,b.el,e);b.life=0;break;}
          if(b.pierce<=0){b.life=0;break;}b.pierce--;

      }
    }
    if(b.life<=0){if(b.aoe&&!b.hit.length)aoe(b.x,b.y,b.aoe*.7,b.dmg*.4,b.el);arr.splice(i,1);}
  }
}
function updEB(dt){
  const arr=D.eb;
  for(let i=arr.length-1;i>=0;i--){
    const b=arr[i];b.t+=dt;b.life-=dt;
    if(b.turn){const a=Math.atan2(b.vy,b.vx)+b.turn*dt,s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;}
    if(b.acc){const s=Math.hypot(b.vx,b.vy),ns=clamp(s+b.acc*dt,0,b.maxS),k=s>0?ns/s:1;b.vx*=k;b.vy*=k;}
    if(b.home&&b.t<b.home){const a=Math.atan2(pl.y-b.y,pl.x-b.x),ca=Math.atan2(b.vy,b.vx);let da=a-ca;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;const na=ca+clamp(da,-1.6*dt,1.6*dt),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;}

    if(pl.inv<=0){const dx=b.x-pl.x,dy=b.y-pl.y;if(dx*dx+dy*dy<(b.r+5.5)*(b.r+5.5)){hurtPlayer(b.dmg);arr.splice(i,1);}}
  }

function updPickups(dt){

function updDun(dt){
  const P=S.p;
  if(G.dead>0){G.dead-=dt;if(G.dead<=0){G.dead=0;exitDungeon(true);}updDunFx(dt);return;}
  D.t+=dt;
  pl.inv=Math.max(0,pl.inv-dt);pl.fcd-=dt;pl.hitT-=dt;
  for(const k in pl.cd)pl.cd[k]=Math.max(0,pl.cd[k]-dt);
  pl.ult=Math.max(0,pl.ult-dt);pl.rampage=Math.max(0,pl.rampage-dt);
  if(pl.frenzy>0){pl.frenzy-=dt;if(pl.frenzy<=0)pl.frenzyN=0;}
  for(const k in pl.buff)if(pl.buff[k]>0)pl.buff[k]-=dt;
  if(pl.rch<ST.dodgeC){pl.rcd-=dt;if(pl.rcd<=0){pl.rch++;pl.rcd=1.1;}}
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const il=Math.hypot(ix,iy);if(il){ix/=il;iy/=il;}
  pl.aim=Math.atan2(mouse.wy-pl.y,mouse.wx-pl.x);
  if(pressed.space&&pl.roll<=0&&pl.rch>0){
    if(pl.rch>=ST.dodgeC)pl.rcd=1.1;
    pl.rch--;tutEvt('roll');pl.roll=.27;pl.inv=Math.max(pl.inv,.25);pl.rdx=il?ix:Math.cos(pl.aim);pl.rdy=il?iy:Math.sin(pl.aim);sfx('dodge');
  }
  const spdMul=(1+ST.move/100)*(pl.rampage>0?1.25:1)*(pl.buff.haste>0?1.2:1);
  if(pl.roll>0){pl.roll-=dt;moveD(pl,pl.rdx*560*dt,pl.rdy*560*dt,9);if(chance(.8))PT.push({x:pl.x,y:pl.y,vx:0,vy:0,l:.3,m:.3,c:S.p.color,s:6,g:0});}
  else moveD(pl,ix*178*spdMul*dt,iy*178*spdMul*dt,9);
  pl.moving=il>0||pl.roll>0;pl.anim+=dt*(pl.moving?1:.3);
  const rate=(ST.weapon?ST.weapon.wb.rate:4)*(1+ST.aspd/100+(pl.ult>0?.6:0)+(pl.rampage>0?.25:0)+(ST.flags.frenzy?Math.min(.3,(pl.frenzyN||0)*.03):0)+(ev('surge')?.3:0));
  if(mouse.l&&pl.fcd<=0&&pl.roll<=0){playerShoot();pl.fcd=1/rate;}
  if(mouse.rp&&pl.cd.nova<=0)castNova();
  if(pressed.q&&pl.cd.ward<=0)castWard();
  if(pressed.r&&ST.flags.ult&&pl.cd.ult<=0){pl.ult=5;pl.cd.ult=cdOf(75);sfx('ult');ringFx(pl.x,pl.y,160,'#ffd24a',.5);floatText(pl.x,pl.y-36,'OVERLOAD!','#ffd24a',20);}
  if(pressed.f&&pl.pot>0&&pl.hp<ST.maxhp){pl.pot--;heal(ST.maxhp*.35);sfx('loot');}
  if(pressed.e)interact();
  pl.hp=Math.min(ST.maxhp,pl.hp+ST.regen*dt);
  for(const e of D.enemies){if(e.dead)continue;if(e.boss)updBoss(e,dt);else updEnemy(e,dt);}
  // soft separation
  const en=D.enemies;
  for(let i=0;i<en.length;i++){const a=en[i];if(a.dead||a.boss||!a.aware)continue;for(let j=i+1;j<en.length;j++){const b=en[j];if(b.dead||b.boss||!b.aware)continue;const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),mn=a.r+b.r;if(dd<mn&&dd>.01){const p=(mn-dd)*.5*Math.min(1,dt*12);moveD(a,-dx/dd*p,-dy/dd*p,a.r*.6);moveD(b,dx/dd*p,dy/dd*p,b.r*.6);}}}
  D.enemies=D.enemies.filter(e=>!e.dead);
  updAllies(dt);updPB(dt);updEB(dt);updPickups(dt);markExp();
  updDunFx(dt);
}

    case'archer':ctx.beginPath();ctx.moveTo(0,-e.r*1.3+bob);ctx.lineTo(e.r,e.r*.8+bob);ctx.lineTo(-e.r,e.r*.8+bob);ctx.closePath();ctx.fill();ctx.strokeStyle=shade(c,.3);ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,bob,e.r*1.3,e.face-.8,e.face+.8);ctx.stroke();break;

    case'charger':ctx.beginPath();ctx.arc(0,bob,e.r,0,TAU);ctx.fill();ctx.fillStyle=e.state===1?'#ff5a5a':shade(c,.5);ctx.beginPath();ctx.moveTo(Math.cos(e.face-.5)*e.r,Math.sin(e.face-.5)*e.r);ctx.lineTo(Math.cos(e.face)*e.r*1.7,Math.sin(e.face)*e.r*1.7);ctx.lineTo(Math.cos(e.face+.5)*e.r,Math.sin(e.face+.5)*e.r);ctx.fill();break;
    case'caster':ctx.beginPath();ctx.arc(0,bob,e.r*.9,0,TAU);ctx.fill();for(let i=0;i<3;i++){const a=D.t*2+i*TAU/3;ctx.fillStyle=c;ctx.beginPath();ctx.arc(Math.cos(a)*e.r*1.5,Math.sin(a)*e.r*1.5+bob,3,0,TAU);ctx.fill();}break;
  }

const ACC={name:'Guest',guest:true};
const NETK='ascendia_net_v3',USERK='ascendia_users_v3',LASTK='ascendia_last_v3';
const NET={ws:null,bc:null,id:Math.random().toString(36).slice(2,10),mode:'local',url:'',up:false,peers:{},sendT:0,dT:0,lastSave:0,dbuf:{},kicked:false};
const PARTYR=[];
let joinReq=null,invReq=null;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const hexs=buf=>Array.prototype.map.call(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){
  try{
    if(window.crypto&&crypto.subtle){
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
      const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},km,256);
      return hexs(bits);
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+':'+pw;
  for(let r=0;r<2000;r++)for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return'f'+(h2>>>0).toString(16)+(h1>>>0).toString(16);
}
function randSalt(){const a=new Uint8Array(16);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<16;i++)a[i]=Math.random()*256;}return hexs(a);}
function getUsers(){try{return JSON.parse(lsGet(USERK)||'{}')||{};}catch(e){return{};}}
async function localRegister(u,p){
  const U=getUsers(),k=u.toLowerCase();if(U[k])return{ok:false,err:'That name is already taken on this device.'};
  const salt=randSalt();U[k]={name:u,salt:salt,hash:await hashPw(p,salt)};lsSet(USERK,JSON.stringify(U));return{ok:true,name:u};
}
async function localLogin(u,p){
  const U=getUsers(),r=U[u.toLowerCase()];if(!r)return{ok:false,err:'No such account on this device. Create one first.'};
  if(await hashPw(p,r.salt)!==r.hash)return{ok:false,err:'Wrong password.'};return{ok:true,name:r.name};
}
function absorbCloud(name,save){
  const key='ascendia_sv3_'+name.toLowerCase();let loc=null;try{loc=JSON.parse(lsGet(key)||'null');}catch(e){}
  if(save&&(!loc||(save.t||0)>(loc.t||0)))lsSet(key,JSON.stringify(save));
}
function wsConnect(url,ms){
  return new Promise(res=>{
    let done=false,ws=null;const fin=v=>{if(!done){done=true;clearTimeout(t);res(v);}};
    const t=setTimeout(()=>{try{ws&&ws.close();}catch(e){}fin(null);},ms||3500);
    try{ws=new WebSocket(url);}catch(e){return fin(null);}
    ws.onopen=()=>fin(ws);ws.onerror=()=>fin(null);ws.onclose=()=>fin(null);
  });
}
function wsRequest(ws,msg,ms){
  return new Promise(res=>{
    const t=setTimeout(()=>{ws.removeEventListener('message',h);res({ok:false,err:'The server timed out.'});},ms||9000);
    function h(ev){let m;try{m=JSON.parse(ev.data);}catch(e){return;}if(m.t==='auth'){clearTimeout(t);ws.removeEventListener('message',h);res(m);}}
    ws.addEventListener('message',h);ws.send(JSON.stringify(msg));
  });
}

// ---------------------------------------------------------------- login screen
function showLogin(startFn){
  const $m=t=>{$('lg-msg').textContent=t||'';};let busy=false;
  const autoUrl=()=>/^https?:$/.test(location.protocol)?(location.protocol==='https:'?'wss://':'ws://')+location.host:'';
  async function probe(){
    if(NET.ws){try{NET.ws.close();}catch(e){}NET.ws=null;}
    const url=($('lg-srv').value||'').trim()||autoUrl();NET.url=url;
    if(!url){$('lg-net').textContent='No realm server configured: accounts are stored on this device, and other tabs of this game count as real players.';return;}
    $('lg-net').textContent='Connecting to '+url+' …';
    const ws=await wsConnect(url,3000);
    if(ws){NET.ws=ws;$('lg-net').textContent='✔ Connected to the realm server: cloud accounts, cloud saves and internet multiplayer are on.';}
    else $('lg-net').textContent='✖ Could not reach '+url+' — using local accounts and same-browser multiplayer.';
  }
  function finish(){
    SAVEKEY='ascendia_sv3_'+(ACC.guest?'guest':ACC.name.toLowerCase());lsSet(LASTK,ACC.guest?'':ACC.name);
    $('login').style.display='none';started=true;startFn();
  }
  async function auth(kind){
    if(busy)return;const u=$('lg-u').value.trim(),p=$('lg-p').value;
    if(!/^[A-Za-z0-9_]{3,16}$/.test(u)){$m('Username: 3–16 letters, numbers or underscore.');return;}
    if(u.toLowerCase().indexOf('guest')===0){$m('Names starting with "guest" are reserved.');return;}
    if(p.length<6){$m('Password must be at least 6 characters.');return;}
    busy=true;$m('Working…');
    try{
      let r;
      if(NET.ws&&NET.ws.readyState===1)r=await wsRequest(NET.ws,{t:kind,u:u,p:p});
      else r=kind==='reg'?await localRegister(u,p):await localLogin(u,p);
      if(!r.ok){$m(r.err||'Failed.');busy=false;return;}
      ACC.name=r.name;ACC.guest=false;if(r.save)absorbCloud(r.name,r.save);finish();
    }catch(e){$m('Error: '+e.message);busy=false;}
  }
  $('lg-in').onclick=()=>auth('login');
  $('lg-reg').onclick=()=>auth('reg');
  $('lg-guest').onclick=async()=>{
    if(busy)return;busy=true;
    if(NET.ws&&NET.ws.readyState===1){const r=await wsRequest(NET.ws,{t:'guest'});if(r&&r.ok)ACC.name=r.name;}
    ACC.guest=true;finish();
  };
  $('lg-con').onclick=()=>{lsSet(NETK,($('lg-srv').value||'').trim());probe();};
  $('lg-p').addEventListener('keydown',e=>{if(e.key==='Enter')auth('login');});
  $('lg-u').value=lsGet(LASTK)||'';$('lg-srv').value=lsGet(NETK)||'';
  $('login').style.display='flex';probe();
}

const peerList=()=>Object.keys(NET.peers).map(k=>NET.peers[k]);
const hubPeers=()=>peerList().filter(p=>p.mode==='hub');
function dunPeers(){if(!D||mode!=='dun')return[];const rs=D.rs>>>0;return peerList().filter(p=>p.mode==='dun'&&p.rs===rs&&p.f===D.f);}
const forMe=m=>NET.mode==='server'||m.to===NET.id;
const num=v=>Number.isFinite(+v)?+v:0;
function netSend(m){
  m.id=NET.id;
  if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(m));}catch(e){}}
  else if(NET.bc){try{NET.bc.postMessage(m);}catch(e){}}
}
function netOpenBC(){
  NET.mode='local';
  try{NET.bc=new BroadcastChannel('ascendia-realm-v3');NET.bc.onmessage=ev=>netRecv(ev.data);}catch(e){NET.bc=null;}
}
function netStart(){
  if(NET.ws&&NET.ws.readyState===1){
    NET.mode='server';
    NET.ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}netRecv(m);};
    NET.ws.onclose=()=>{if(NET.kicked)return;NET.mode='local';NET.ws=null;NET.peers={};chat('System','','Disconnected from the realm server — switched to local mode.');netOpenBC();netSend({t:'hello'});};
  }else netOpenBC();
  NET.up=true;
  netSend({t:'hello'});netSendState();
  addEventListener('beforeunload',()=>netSend({t:'leave'}));
  setInterval(()=>{if(document.hidden)netSendState();},1000);
}
function netSendState(){
  if(!NET.up||!S)return;const P=S.p,hide=mode==='plat';
  netSend({t:'st',name:P.name,color:P.color,lvl:P.lvl,fl:P.bestEver,mode:mode,f:(D&&mode==='dun')?D.f:0,rs:(mode==='dun'?(G.runSeed||0):0),x:hide?0:Math.round(pl.x),y:hide?0:Math.round(pl.y),face:+(pl.aim||0).toFixed(2),mv:!!pl.moving});
}
function netRecv(m){
  if(!m||typeof m.t!=='string'||m.id===NET.id||!S)return;
  const now=performance.now();
  switch(m.t){
    case'welcome':(m.peers||[]).forEach(netRecv);return;
    case'kick':NET.kicked=true;NET.up=false;toast('Your account logged in somewhere else.');chat('System','','Your account was logged in from another place. Reload to continue.');return;
    case'hello':netSendState();return;
    case'leave':{const p=NET.peers[m.id];if(p){delete NET.peers[m.id];chat('System','',p.name+' left the realm.');partyDrop(m.id,true);}return;}
    case'st':{
      let p=NET.peers[m.id];const nm=String(m.name||'?').slice(0,16);
      if(!p){p=NET.peers[m.id]={id:m.id,name:nm,x:num(m.x),y:num(m.y),tx:num(m.x),ty:num(m.y),ph:Math.random()*6,sayT:0,say:'',pm:null};chat('System','',nm+' entered the realm.');}
      p.name=nm;p.color=/^#[0-9a-f]{6}$/i.test(m.color)?m.color:'#ffd24a';p.lvl=num(m.lvl)|0;p.fl=num(m.fl)|0;p.mode=String(m.mode);p.f=num(m.f)|0;p.rs=num(m.rs)>>>0;p.mv=!!m.mv;p.face=num(m.face);
      p.tx=num(m.x);p.ty=num(m.y);p.seen=now;
      if(p.pm!==p.mode){p.x=p.tx;p.y=p.ty;}p.pm=p.mode;return;
    }
    case'chat':{
      const msg=String(m.msg||'').slice(0,120),nm=String(m.name||'?').slice(0,16),col=/^#[0-9a-f]{6}$/i.test(m.color)?m.color:'#ffd24a';
      if(m.ch==='Whisper'){if(!forMe(m))return;chat('Whisper',nm+' → you',msg,col);}
      else if(m.ch==='Party'){if(!forMe(m))return;chat('Party',nm,msg,col);if(!PARTYL)for(const id of PARTYR)if(id!==m.id)netSend({t:'chat',ch:'Party',to:id,name:nm,color:col,msg:msg});}
      else{chat('World',nm,msg,col);const p=NET.peers[m.id];if(p){p.say=msg.length>34?msg.slice(0,32)+'…':msg;p.sayT=4.5;}}
      return;
    }
    case'inv':{if(!forMe(m))return;const p=NET.peers[m.id],nm=p?p.name:'Someone';invReq={id:m.id,name:nm,left:25};chat('Party','',nm+' invited you to a party. Press Y to accept.');toast(nm+' invited you to a party — press Y to accept');sfx('portal');return;}
    case'acc':{if(!forMe(m))return;const p=NET.peers[m.id];if(PARTYR.indexOf(m.id)<0)PARTYR.push(m.id);chat('Party','',(p?p.name:'A player')+' joined your party.');sfx('buy');return;}
    case'pleave':{if(!forMe(m))return;const i=PARTYR.indexOf(m.id);if(i>=0){PARTYR.splice(i,1);if(m.id===PARTYL)PARTYL=null;const p=NET.peers[m.id];chat('Party','',(p?p.name:'A player')+' left your party.');}return;}
    case'run':{
      if(!forMe(m)||m.id!==PARTYL||G.tut)return;
      const rs=num(m.rs)>>>0,f=Math.max(1,num(m.f)|0),p=NET.peers[m.id],nm=p?p.name:'Your leader';
      if(mode==='dun'&&D&&(D.rs>>>0)===rs){if(D.f!==f){toast(nm+' descended — following');transition(()=>{buildFloor(f);});}return;}
      if(mode!=='hub')return;
      closePanel();toast(nm+' entered floor '+f+' — joining');chat('Party','',nm+' is descending to floor '+f+'. You follow.');startDungeon(f,rs,true);return;
    }
    case'lead':{
      if(!forMe(m)||m.id!==PARTYL)return;const all=(m.all||[]).filter(x=>typeof x==='string');
      if(m.nl===NET.id){PARTYL=null;PARTYR.length=0;all.forEach(x=>{if(x!==NET.id)PARTYR.push(x);});chat('Party','','You are now the party leader.');}
      else{PARTYL=String(m.nl);PARTYR.length=0;PARTYR.push(PARTYL);chat('Party','','The party leader changed.');}return;
    }
    case'ginfo':{GUILD=m.guild||null;recalc();if(G.panel==='guild')renderPanel();if(G.ginfoSay&&GUILD){G.ginfoSay=0;chat('Guild','',GUILD.name+': '+GUILD.members.map(x=>x.name+(x.online?'*':'')).join(', '));}return;}
    case'gnote':chat('Guild','',String(m.msg||''));return;
    case'gmsg':chat('Guild',String(m.name||'?').slice(0,16),String(m.msg||'').slice(0,120),'#7de0ff');return;
    case'dmg':{
      if(!forMe(m)||mode!=='dun'||!D||(num(m.rs)>>>0)!==(D.rs>>>0)||num(m.f)!==D.f||!Array.isArray(m.d))return;
      for(const pr of m.d){
        const e=D.bySid[pr[0]];if(!e||e.dead||e.inv>0)continue;
        const dm=num(pr[1])*e.max;if(!(dm>0))continue;
        e.hp-=dm;e.flash=.08;if(!e.boss)e.aware=true;
        floatText(e.x+rnd(-8,8),e.y-e.r-8,Math.round(dm),'#9fd0ff',12);
        if(e.hp<=0)killEnemy(e);
      }
      return;
    }
  }
}
function netDmg(e,dmg){if(!NET.up||!D||mode!=='dun'||!dunPeers().length)return;NET.dbuf[e.sid]=(NET.dbuf[e.sid]||0)+dmg/e.max;}
function netTick(dt){
  if(!NET.up)return;
  NET.sendT+=dt;if(NET.sendT>=(mode==='hub'?.1:.12)){NET.sendT=0;netSendState();}
  NET.dT+=dt;
  if(NET.dT>.12){
    NET.dT=0;const ks=Object.keys(NET.dbuf);
    if(ks.length&&D&&mode==='dun'){const d=ks.map(k=>[+k,NET.dbuf[k]]);for(const p of dunPeers())netSend({t:'dmg',to:p.id,rs:D.rs>>>0,f:D.f,d:d});}
    NET.dbuf={};
  }
  const now=performance.now(),k=Math.min(1,dt*12);
  for(const id in NET.peers){
    const p=NET.peers[id];p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;p.sayT=Math.max(0,p.sayT-dt);
    if(now-p.seen>15000){delete NET.peers[id];chat('System','',p.name+' lost connection.');partyDrop(id,true);}
  }
  if(invReq&&(invReq.left-=dt)<=0)invReq=null;
  if(joinReq&&(joinReq.left-=dt)<=0)joinReq=null;
}
function netChat(v){netSend({t:'chat',ch:'World',name:S.p.name,color:S.p.color,msg:v});}
function findPeer(name){
  const n=name.toLowerCase(),l=peerList();
  return l.find(p=>p.name.toLowerCase()===n)||l.find(p=>p.name.toLowerCase().indexOf(n)===0);
}
function netWhisper(name,msg){
  const p=findPeer(name);if(!p){chat('System','','No real player named "'+name+'" is online.');return;}
  netSend({t:'chat',ch:'Whisper',to:p.id,name:S.p.name,color:S.p.color,msg:msg});chat('Whisper','To '+p.name,msg);
}
function netInvite(id){
  const p=NET.peers[id];if(!p)return;if(PARTYR.indexOf(id)>=0)return;
  if(PARTYL){toast('Only the party leader can invite');return;}if(PARTYR.length>=3){toast('Party is full');return;}
  netSend({t:'inv',to:id});chat('Party','','You invited '+p.name+'.');toast('Invite sent to '+p.name);
}
function netAccept(){
  if(invReq){
    const r=invReq;invReq=null;if(PARTYR.length){chat('Party','','Leave your current party first (/party leave).');return;}PARTYR.push(r.id);PARTYL=r.id;
    netSend({t:'acc',to:r.id});chat('Party','','You joined '+r.name+'\'s party. You will follow the leader into every dungeon.');sfx('buy');return;
  }
  if(joinReq&&mode==='hub'&&!G.panel){const r=joinReq;joinReq=null;startDungeon(Math.min(r.f,S.p.maxFloor+5),r.rs,true);}
}
function partyDrop(id,silent){
  const i=PARTYR.indexOf(id);if(i<0)return;PARTYR.splice(i,1);if(id===PARTYL)PARTYL=null;
  if(!silent){netSend({t:'pleave',to:id});const p=NET.peers[id];chat('Party','','You removed '+(p?p.name:'a player')+' from your party.');}
}
function partyLeaveAll(){if(!PARTYR.length){chat('System','','You are not in a party.');return;}for(const id of PARTYR.slice())partyDrop(id);PARTYL=null;}
function netRunStart(f,rs){if(PARTYL)return;for(const id of PARTYR)netSend({t:'run',to:id,f:f,rs:rs});}
function netCloudSave(){
  if(!(NET.mode==='server'&&NET.ws&&NET.ws.readyState===1&&!ACC.guest))return;
  const now=Date.now();if(now-NET.lastSave<20000)return;NET.lastSave=now;
  try{NET.ws.send(JSON.stringify({t:'save',save:S}));}catch(e){}
}
function netPanelHtml(){
  const peers=peerList();
  let h='<div class="card"><b>Connection:</b> '+(NET.mode==='server'?'<span style="color:#7dff9a">Realm server ('+esc(NET.url)+')</span> — internet multiplayer and cloud save are active':'<span style="color:#ffd24a">Local realm</span> — other tabs or windows of this game in this browser appear as real players. For internet play connect to a realm server (Menu → 🌐).')+' · Account <b>'+esc(ACC.name)+'</b>'+(ACC.guest?' (guest)':'')+'</div>';
  h+='<h3>Real players online ('+peers.length+')</h3>';
  if(!peers.length)h+='<div class="sm">Nobody else is here right now. Open another tab or connect to a realm server to meet other players.</div>';
  for(const p of peers){
    const ip=PARTYR.indexOf(p.id)>=0;
    h+='<div class="card row" style="margin-bottom:4px"><span><b style="color:'+p.color+'">★ '+esc(p.name)+'</b> <span class="sm">Lv '+p.lvl+' · best floor '+p.fl+' · '+(p.mode==='dun'?'in dungeon, floor '+p.f:p.mode==='hub'?'in town':'in a trial')+(ip?' · in your party':'')+'</span></span><span>'+(ip?'<button class="btn red" data-a="pleave" data-id="'+p.id+'">Leave party</button>':'<button class="btn" data-a="pinvite" data-id="'+p.id+'">Invite</button>')+'<button class="btn" data-a="pwhisper" data-id="'+p.id+'">Whisper</button></span></div>';
  }
  return h;
}

// ============================================================ HUD
function drawMini(){
  const mw=150,x=W-mw-12,y=64;
  ctx.fillStyle='rgba(6,8,20,.72)';rr(x,y,mw,mw,8);ctx.fill();ctx.strokeStyle='rgba(120,140,255,.4)';ctx.stroke();
  ctx.save();rr(x,y,mw,mw,8);ctx.clip();
  if(mode==='dun'){
    const sc=2.6,cx=Math.floor(pl.x/TS),cy=Math.floor(pl.y/TS),R=Math.floor(mw/2/sc);
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const tx=cx+i,ty=cy+j;if(tx<0||ty<0||tx>=D.w||ty>=D.h)continue;const k=ty*D.w+tx;if(!D.exp[k])continue;ctx.fillStyle=D.g[k]?'rgba(140,160,255,.45)':'rgba(40,50,90,.6)';ctx.fillRect(x+mw/2+i*sc,y+mw/2+j*sc,sc,sc);}
    const mk=(o,c,s)=>{ctx.fillStyle=c;ctx.fillRect(x+mw/2+(o.x-pl.x)/TS*sc-s/2,y+mw/2+(o.y-pl.y)/TS*sc-s/2,s,s);};
    for(const p of dunPeers())mk(p,'#ffd24a',4);if(D.exit.active)mk(D.exit,'#5aff8a',5);if(D.portal&&!D.portal.used)mk(D.portal,'#c45dff',5);
    for(const e of D.enemies)if(!e.dead&&(e.boss||Math.hypot(e.x-pl.x,e.y-pl.y)<420))mk(e,e.boss?'#ff2a5a':'#ff6a6a',e.boss?6:3);
    for(const c of D.chests)if(!c.open&&D.exp[Math.floor(c.y/TS)*D.w+Math.floor(c.x/TS)])mk(c,'#ffd24a',3);
    ctx.fillStyle='#fff';ctx.fillRect(x+mw/2-2,y+mw/2-2,4,4);
  }else if(mode==='hub'){
    const sc=mw/HW;ctx.fillStyle='rgba(50,110,60,.5)';ctx.fillRect(x,y,mw,HH*sc);
    for(const s of STN){ctx.fillStyle=s.gate?'#c45dff':'#ffd24a';ctx.fillRect(x+s.ix*sc-2,y+s.iy*sc-2,4,4);}
    for(const b of BOTS)if(b.state!=='away'){ctx.fillStyle=b.inParty?'#7dff9a':'#7ab4ff';ctx.fillRect(x+b.x*sc-1,y+b.y*sc-1,2,2);}
    for(const p of hubPeers()){ctx.fillStyle='#ffd24a';ctx.fillRect(x+p.x*sc-2,y+p.y*sc-2,4,4);}ctx.fillStyle='#fff';ctx.fillRect(x+pl.x*sc-2,y+pl.y*sc-2,4,4);
  }
  ctx.restore();
}
function drawHUD(){
  const P=S.p;ctx.textAlign='left';
  if(mode!=='plat'){
    bar(14,14,230,16,pl.hp/ST.maxhp,'#ff3a5a','#ff7a8a',Math.ceil(pl.hp)+' / '+ST.maxhp);
    bar(14,38,230,8,P.lvl>=100?1:P.xp/xpNeed(P.lvl),'#5a8aff','#5affd0');
    ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText(P.name+'  Lv '+P.lvl+(P.ascs?'  ✧'+P.ascs:''),14,64);
    ctx.fillStyle='#ffd96a';ctx.fillText('◈ '+fmt(P.gold),14,82);ctx.fillStyle='#6fd6ff';ctx.fillText('✦ '+fmt(P.ess),90,82);
    ctx.fillStyle='rgba(220,230,255,.7)';ctx.font='11px system-ui';ctx.fillText('Online '+(1+peerList().length)+(PARTYR.length?' · Party '+(PARTYR.length+1):'')+(GUILD?' · '+GUILD.name:''),14,98);
    drawMini();
  }
  ctx.textAlign='center';ctx.font='700 15px system-ui';ctx.fillStyle='#fff';
  if(mode==='dun'){ctx.fillText(D.f?'Floor '+D.f+' — '+D.biome.n:'Tutorial — '+D.biome.n,W/2,24);}
  else if(mode==='hub'){const ph=(G.clock%300)/300;ctx.fillText('Ascendia Hub — '+(Math.sin(ph*TAU)>0?'Day':'Night'),W/2,24);}
  else if(mode==='plat'){const L=PL;ctx.fillText('Secret Dimension  ·  '+L.t.toFixed(1)+'s  ·  Deaths '+L.deaths+'  ·  Shards '+L.got+'/'+L.total,W/2,24);
    bar(W/2-150,36,300,8,clamp(L.p.x/(L.Wc*TT-600),0,1),'#ff6ac1','#ffd24a');}
  if(G.evt){ctx.font='600 12px system-ui';ctx.fillStyle=G.evt.c;ctx.fillText('◆ '+G.evt.n+' ('+Math.ceil(G.evt.left)+'s)',W/2,42+(mode==='plat'?14:0));}
  ctx.textAlign='left';
  if(mode==='dun'){
    drawTutArrow();const b=D.enemies.find(e=>e.boss&&e.aware&&!e.dead);
    if(b){const w=Math.min(520,W-300);bar(W/2-w/2,58,w,14,b.hp/b.max,b.bcol,'#fff');ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.fillText(b.name,W/2,54);ctx.textAlign='left';}
    // skill bar
    const sk=[['LMB','Shoot',0,0],['RMB','Nova',pl.cd.nova,cdOf(14)],['Q','Ward',pl.cd.ward,cdOf(20)],['R','Ult',ST.flags.ult?pl.cd.ult:-1,cdOf(75)],['SPC','Roll',pl.rch>0?0:1.1,1.1],['F','Potion '+pl.pot,pl.pot>0?0:1,1]];
    const bw=54,tx=W/2-sk.length*bw/2;
    sk.forEach((s,i)=>{const x=tx+i*bw,y=H-66;ctx.fillStyle='rgba(8,10,26,.8)';rr(x,y,bw-6,48,8);ctx.fill();ctx.strokeStyle=s[2]===-1?'#333':'#6a7aff';ctx.stroke();
      if(s[2]>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x+1,y+1,bw-8,46*clamp(s[2]/s[3],0,1));}
      ctx.fillStyle=s[2]===-1?'#555':'#fff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(s[0],x+(bw-6)/2,y+20);ctx.font='10px system-ui';ctx.fillText(s[1],x+(bw-6)/2,y+36);ctx.textAlign='left';});
    if(pl.rch>0||ST.dodgeC>1){ctx.fillStyle='#5affd0';ctx.font='10px system-ui';ctx.fillText('Rolls '+pl.rch+'/'+ST.dodgeC,tx+4*bw,H-72);}
    const t=interactTarget();if(t){ctx.textAlign='center';ctx.fillStyle='#5affd0';ctx.font='700 14px system-ui';ctx.fillText('[E] '+t.l,W/2,H-84);ctx.textAlign='left';}
    let by=110;ctx.font='11px system-ui';for(const k in pl.buff)if(pl.buff[k]>0){ctx.fillStyle='#ffd24a';ctx.fillText(k.toUpperCase()+' '+Math.ceil(pl.buff[k])+'s',14,by+=14);}
    if(pl.ult>0){ctx.fillStyle='#ffd24a';ctx.fillText('OVERLOAD '+pl.ult.toFixed(1)+'s',14,by+=14);}
    if(G.flash>0){const g=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.8);g.addColorStop(0,'rgba(255,0,40,0)');g.addColorStop(1,'rgba(255,0,40,'+clamp(G.flash*1.6,0,.6)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    if(G.dead>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff5a7a';ctx.font='800 54px system-ui';ctx.fillText('YOU DIED',W/2,H/2);ctx.textAlign='left';}
  }
  ctx.fillStyle='rgba(200,210,255,.5)';ctx.font='11px system-ui';ctx.textAlign='right';
  ctx.fillText(mode==='hub'?'[I] Gear  [T] Talents  [P] Party  [G] Guild  [J] Quests  [M] Merchant  [K] Ascend  [H] Help':'[I] Gear  [T] Talents  [P] Party  [G] Guild  [Esc] Menu  [H] Help',W-12,H-10);ctx.textAlign='left';
  if(G.evt&&G.evt.id==='blood'){ctx.fillStyle='rgba(120,0,20,.08)';ctx.fillRect(0,0,W,H);}
}

// ============================================================ MAIN LOOP
function onKey(k,e){
  if(G.fade)return;
  if(k==='enter'){openChat();e.preventDefault();return;}
  if(k==='escape'){if(G.panel){if(G.panel==='result')return;closePanel();}else openPanel('menu');return;}
  if(G.panel==='result')return;
  if(k==='y')netAccept();else if(k==='i')togglePanel('inv');else if(k==='t')togglePanel('tal');else if(k==='h')togglePanel('help');
  else if(k==='n'){S.set.mute=!S.set.mute;toast('Sound '+(S.set.mute?'off':'on'));}
  else if(k==='g')togglePanel('guild');else if(k==='p')togglePanel('party');else if(mode==='hub'){const m={j:'quest',m:'market',k:'asc'}[k];if(m)togglePanel(m);}
}
const paused=()=>!!G.panel&&mode!=='hub';
function update(dt){
  G.t+=dt;G.clock+=dt;S.p.play+=dt;
  mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y;
  tickEvents(dt);netTick(dt);tutTick();
  G.mktT+=dt;if(G.mktT>240){G.mktT=0;refreshMarket();}
  G.saveT+=dt;if(G.saveT>15){G.saveT=0;save();}
  G.shake*=Math.pow(.001,dt);if(G.shake<.2)G.shake=0;G.flash=Math.max(0,G.flash-dt);
  if(G.slowT>0){G.slowT-=dt;if(G.slowT<=0)G.slow=1;}
  updGlobalFx(dt);
  if(G.fade){G.fade.t+=dt*2.6;if(!G.fade.done&&G.fade.t>=1){G.fade.done=true;G.fade.cb();}if(G.fade.t>=2)G.fade=null;return;}
  if(mode==='hub')updHub(dt);
  else if(mode==='dun'){if(!paused())updDun(dt*G.slow);}
}
function render(){
  if(mode==='hub')drawHub();else if(mode==='dun'&&D)drawDun();
  drawHUD();
  if(G.fade){const a=G.fade.t<1?G.fade.t:2-G.fade.t;ctx.fillStyle='rgba(0,0,0,'+clamp(a,0,1)+')';ctx.fillRect(0,0,W,H);}
}
let lastT=0,errShown=false;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
  try{update(dt);render();}catch(e){if(!errShown){errShown=true;console.error(e);}}
  for(const k in pressed)delete pressed[k];mouse.rp=false;mouse.lp=false;
  requestAnimationFrame(frame);
}
function boot(){
  resize();
  const had=load();if(!had&&!ACC.guest)S.p.name=ACC.name;if(had&&S.p.tutDone===undefined)S.p.tutDone=true;recalc();
  pl.hp=ST.maxhp;
    ensureQuests();refreshMarket();
  enterHubAt(1100,520);netStart();
  chat('System','','Welcome to Ascendia, '+S.p.name+(had?' — progress loaded.':'!')+' Walk with WASD, press E at buildings, H for help.');
  
  if(!S.p.tutDone)startTutorial();
  addEventListener('beforeunload',()=>{NET.lastSave=0;save();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.ASC={S:()=>S,D:()=>D,G,pl,NET,startDungeon,startTutorial,openPanel,genItem,save,update,render,chatCmd,netRecv,renderPanel,mode:()=>mode,PARTYR,PARTYL:()=>PARTYL,recalc,TUT,tutNext,buildFloor,keys,mouse};
  requestAnimationFrame(frame);
}
showLogin(boot);
})();
